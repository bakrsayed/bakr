name: NUCA pager probe

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - name: Capture exact Chrome form POST then abort locally
        run: |
          python - <<'PY'
          import json, time
          from urllib.parse import parse_qs
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
              ctx=browser.new_context(locale='ar-EG',user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36')
              page=ctx.new_page()
              page.set_default_timeout(15000)
              page.goto('https://lands.nuca.gov.eg/ar/ViewZone.aspx?ID=3792',wait_until='domcontentloaded',timeout=60000)
              print('GET_OK',page.url,flush=True)
              checked=page.locator("input[name='ctl00$MainContent$PlotType']:checked")
              print('CHECKED_RADIO',checked.count(),checked.first.get_attribute('value') if checked.count() else None,flush=True)
              captured=[]
              def handler(route):
                  req=route.request
                  if req.method=='POST' and 'ViewZone.aspx' in req.url:
                      body=req.post_data or ''
                      d=parse_qs(body,keep_blank_values=True)
                      info={
                        'url':req.url,'body_len':len(body),'keys':sorted(d.keys()),
                        'target':d.get('__EVENTTARGET',[''])[0],
                        'argument':d.get('__EVENTARGUMENT',[''])[0],
                        'plot_type':d.get('ctl00$MainContent$PlotType',[''])[0],
                        'search':d.get('ctl00$MainContent$txtPlotNumber',[''])[0],
                        'lens':{k:len(v[0]) if v else 0 for k,v in d.items()},
                        'headers':{k:v for k,v in req.headers.items() if k.lower() in ['origin','referer','content-type','sec-fetch-site','sec-fetch-mode','sec-fetch-dest','sec-fetch-user','upgrade-insecure-requests']}
                      }
                      captured.append(info)
                      print('REAL_POST '+json.dumps(info,ensure_ascii=False,separators=(',',':')),flush=True)
                      route.abort('aborted')
                  else:
                      route.continue_()
              page.route('**/*',handler)
              link=page.locator("#MainContent_grdPlots a[href*='Page$2']").first
              print('LINK',link.count(),link.get_attribute('href') if link.count() else None,flush=True)
              try:
                  link.click(timeout=10000,no_wait_after=True)
              except Exception as e:
                  print('CLICK_END',type(e).__name__,str(e),flush=True)
              time.sleep(1)
              print('CAPTURE_COUNT',len(captured),flush=True)
              if not captured:
                  raise SystemExit('no POST captured')
              browser.close()
          PY
