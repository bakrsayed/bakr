name: NUCA pager probe

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Validate Page 2 on small zone
        run: |
          python - <<'PY'
          import json
          from app import probe_zone
          result = probe_zone(3792, 2)
          print('NUCA_SMALL_ZONE '+json.dumps(result, ensure_ascii=False, separators=(',',':')))
          if not result.get('ok'):
              raise SystemExit('pagination probe did not change page')
          PY
