name: NUCA pager probe

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 beautifulsoup4==4.13.5
      - name: Test full ASP.NET postback
        shell: bash
        run: |
          python - <<'PY'
          import json, re, socket, time
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          zone=3792
          url=f'https://lands.nuca.gov.eg/ar/ViewZone.aspx?ID={zone}'
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
          h={'User-Agent':ua,'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8','Accept-Language':'ar-EG,ar;q=0.9,en-US;q=0.7,en;q=0.6','Upgrade-Insecure-Requests':'1'}
          print('DNS',socket.gethostbyname_ex('lands.nuca.gov.eg'),flush=True)
          s=requests.Session()
          t=time.time()
          try:
              r=s.get(url,headers=h,timeout=(8,25))
              print('GET',r.status_code,round(time.time()-t,3),len(r.content),[(c.name,len(c.value)) for c in s.cookies],flush=True)
              r.raise_for_status()
          except Exception as e:
              print('GET_ERROR',type(e).__name__,str(e),round(time.time()-t,3),flush=True)
              raise
          soup=BeautifulSoup(r.text,'html.parser'); form=soup.find('form')
          d={}
          successful=[]
          for x in form.find_all(['input','select','textarea']):
              name=x.get('name')
              if not name or x.has_attr('disabled'): continue
              if x.name=='input':
                  typ=(x.get('type') or 'text').lower()
                  if typ in {'submit','button','image','file','reset'}: continue
                  if typ in {'radio','checkbox'} and not x.has_attr('checked'): continue
                  val=x.get('value','')
              elif x.name=='select':
                  opt=x.find('option',selected=True) or x.find('option'); val=opt.get('value','') if opt else ''
              else: val=x.get_text()
              d[name]=val; successful.append((name,typ if x.name=='input' else x.name,val if len(val)<80 else f'<len:{len(val)}>'))
          d['__EVENTTARGET']='ctl00$MainContent$grdPlots'; d['__EVENTARGUMENT']='Page$2'; d.setdefault('__LASTFOCUS','')
          print('CONTROLS',json.dumps(successful,ensure_ascii=False,separators=(',',':')),flush=True)
          print('RADIO',d.get('ctl00$MainContent$PlotType'),'SEARCH',repr(d.get('ctl00$MainContent$txtPlotNumber')),flush=True)
          ph=dict(h); ph.update({'Origin':'https://lands.nuca.gov.eg','Referer':r.url,'Content-Type':'application/x-www-form-urlencoded','Sec-Fetch-Site':'same-origin','Sec-Fetch-Mode':'navigate','Sec-Fetch-User':'?1','Sec-Fetch-Dest':'document','Cache-Control':'max-age=0'})
          t=time.time()
          try:
              r2=s.post(urljoin(r.url,form.get('action') or r.url),headers=ph,data=d,timeout=(8,25),allow_redirects=True)
              print('POST',r2.status_code,round(time.time()-t,3),len(r2.content),r2.url,flush=True)
              soup2=BeautifulSoup(r2.text,'html.parser'); grid=soup2.select_one('#MainContent_grdPlots'); plots=[]
              if grid:
                  for tr in grid.select('tr:not(.footer)'):
                      tds=tr.find_all('td',recursive=False)
                      if len(tds)>=10:
                          cells=[' '.join(td.get_text(' ',strip=True).split()) for td in tds]
                          if len(cells)>2 and re.fullmatch(r'[0-9A-Za-z\-/]+',cells[1] or '') and re.fullmatch(r'\d+(?:\.\d+)?',cells[2].replace(',','') or ''):
                              plots.append(cells[1])
              print('PLOTS',plots,'N',len(plots),flush=True)
              if not plots: raise SystemExit('POST returned no data rows')
          except Exception as e:
              print('POST_ERROR',type(e).__name__,str(e),round(time.time()-t,3),flush=True)
              raise
          PY
